# Builds the page from config.yaml and serves it with nginx.
#
#   docker compose up -d --build     # rebuild after editing config.yaml
#
# Change the port or listen address with HOMEPAGE_PORT / HOMEPAGE_BIND,
# in the environment or in a .env file next to this one.

services:
  homepage:
    build: .
    image: homepage
    ports:
      - "${HOMEPAGE_BIND:-0.0.0.0}:${HOMEPAGE_PORT:-8080}:80"
    restart: unless-stopped
