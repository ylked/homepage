# Homelab homepage — edit this file, then run `python build.py`.
# It generates dist/index.html. Every service is linked; LAN-only ones are marked
# with a lock and only open from the home network.

site:
  title: Homelab
  subtitle: Services running at home
  theme: auto            # auto | light | dark  (visitors can still toggle)
  open_in_new_tab: true
  # favicon: https://example.com/favicon.svg
  footer: Self-hosted with care · built from config.yaml

  # Live up/down dots from a *published* Uptime Kuma status page.
  # The browser fetches it directly, so Kuma must send CORS headers (see README).
  # Remove this block to turn status off entirely.
  uptime_kuma:
    url: https://status.ylked.ch
    slug: default        # the status page's slug (https://status.ylked.ch/status/<slug>)
    refresh: 60          # seconds between refreshes

  # Override any visible wording.
  labels:
    external: Public
    internal: LAN only
    # search_placeholder: Search services…
    # empty: No service matches that search.
    # lan_link: LAN

# Each category is a section on the page, shown in this order.
#
# Service fields:
#   name         required
#   url          required. The address you normally use.
#   external     true if it is reachable from the internet (globe icon), false/omitted
#                for LAN-only (lock icon)
#   local_url    optional direct LAN address, shown as a small "LAN" link
#   description  optional one-liner
#   icon         emoji, di:<name> (dashboard-icons), sh:<name> (selfh.st icons),
#                si:<name> (simple-icons, monochrome), local:<file> (from icons/, inlined),
#                or any image URL. Omitted -> first letter of the name.
#   monitor      Uptime Kuma monitor name (case-insensitive) or numeric id
#   tags         optional list, searchable
#   badge        optional short free text, e.g. "beta"
#   hidden: true -> left off the page
#
# Categories accept: name (required), description, icon, hidden.

categories:
  - name: Media
    icon: 🎬
    services:
      - name: Jellyfin
        url: https://tv.ylked.ch
        description: Movies, series and music
        icon: sh:jellyfin
        external: true
        monitor: Jellyfin
        tags: [media, streaming]

